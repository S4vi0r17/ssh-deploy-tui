app_name: "S4v!0r Deploy"

ssh:
  host: tu-ip-o-dominio
  port: 22
  user: tu-usuario
  identity_file: $HOME/.ssh/id_rsa
  # Las sesiones SSH no-interactivas no cargan .zshrc, asi que node/bun/pnpm
  # no estan en el PATH sin esto.
  init_cmd: "export PATH=$HOME/.local/share/fnm:$PATH && eval \"$(fnm env --shell zsh)\" && export PATH=$HOME/.bun/bin:$HOME/.local/share/pnpm:$PATH && export GIT_SSH_COMMAND='ssh -i $HOME/.ssh/id_rsa -o IdentitiesOnly=yes'"

projects:
  mi-backend:
    name: "Mi Backend"
    path: /var/www/html/mi-backend
    type: pm2
    branch: main
    package_manager: pnpm
    install_cmd: pnpm install
    test_cmd: pnpm test # opcional, aborta el deploy si falla
    build_cmd: pnpm build
    pm2_name: mi-backend

  mi-frontend:
    name: "Mi Frontend"
    path: /var/www/html/mi-frontend
    type: static
    branch: main
    package_manager: bun
    install_cmd: bun install
    # {{out}} = dist.new. Se compila ahi mientras dist sigue sirviendo, y al
    # terminar se publica con un swap. Ver README.
    build_cmd: bun run build --outDir {{out}} --emptyOutDir
    output_dir: dist

nginx:
  config_path: /etc/nginx/nginx.conf
  sites_path: /etc/nginx/sites-available

tunnels:
  - name: "MySQL CRS"
    local_port: 3306
    remote_host: "127.0.0.1"
    remote_port: 3306
    auto_start: true
